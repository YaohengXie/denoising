project:
  name: bsslab_esc50_enhanced_v2_m7_robust_sqi
  seed: 1337

paths:
  raw_bsslab_dir: data/raw/bsslab
  manifest_csv: data/manifests/bsslab_manifest.csv
  processed_dir: data/processed/bsslab_npz
  windows_dir: data/windows/bsslab_esc50_enhanced_v2
  output_dir: outputs/bsslab_esc50_enhanced_v2_m7_robust_sqi

data:
  fs_model: 2000
  window_sec: 4.0
  hop_sec: 2.0
  train_subjects: [1, 2, 3, 4, 5, 6, 7, 8]
  val_subjects: [9, 10]
  test_subjects: [11, 12]

stft:
  n_fft: 256
  win_length: 256
  hop_length: 32

model:
  name: unet_transformer_ecg_esc50_enhanced_v2_m7_robust_sqi
  input_channels: 2
  use_ecg: true
  use_transformer: true
  base_channels: 16
  transformer_layers: 2
  transformer_heads: 4
  dropout: 0.1

training:
  batch_size: 8
  epochs: 8
  lr: 0.0001
  num_workers: 0
  device: auto
  init_checkpoint: outputs/bsslab_esc50_enhanced_v2_m7_robust/checkpoints/best.pt
  trainable_modules: [sqi_head]
  loss:
    waveform_l1: 0.0
    mag_l1: 0.0
    s1s2_weighted_waveform_l1: 0.0
    s1s2_weighted_mag_l1: 0.0
    s1s2_bce: 0.0
    sqi_mse: 1.0
